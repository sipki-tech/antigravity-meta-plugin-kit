name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, e2e, and docs-parity tests
        run: npm test
      - name: Self-lint (strict) via meta-kit CLI
        run: node plugins/antigravity-meta-plugin-kit/scripts/meta-kit.mjs lint --strict .
      - name: Doctor smoke (isolated empty home)
        run: |
          tmp="$(mktemp -d)"
          node plugins/antigravity-meta-plugin-kit/scripts/meta-kit.mjs doctor --home "$tmp" --workspace "$GITHUB_WORKSPACE" --json > /dev/null
      - name: Smoke — create --dry-run plans actions and writes nothing
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          out="$(node "$GITHUB_WORKSPACE/plugins/antigravity-meta-plugin-kit/scripts/meta-kit.mjs" create demo-plugin --dry-run)"
          printf '%s\n' "$out" | grep -q "would create"
          test ! -e demo-plugin
      - name: Smoke — scaffold all profiles, lint --strict, and run generated tests
        run: |
          tmp="$(mktemp -d)"
          for spec in \
            "p-default:" \
            "p-minimal:--minimal" \
            "p-agents:--with-agents" \
            "p-sidecar:--with-sidecar" \
            "p-cli:--with-cli" \
            "p-minimal-cli:--minimal --with-cli" \
            "p-dot:--manifest-layout dot-antigravity --with-agents --with-cli"; do
            name="${spec%%:*}"
            flags="${spec#*:}"
            # shellcheck disable=SC2086
            node "$GITHUB_WORKSPACE/plugins/antigravity-meta-plugin-kit/scripts/meta-kit.mjs" create "$name" --dir "$tmp" $flags
            node "$GITHUB_WORKSPACE/plugins/antigravity-meta-plugin-kit/scripts/meta-kit.mjs" lint --strict "$tmp/$name"
            (cd "$tmp/$name" && npm test)
          done
