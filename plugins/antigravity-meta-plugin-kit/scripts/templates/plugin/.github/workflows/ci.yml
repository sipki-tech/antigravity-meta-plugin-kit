name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit & e2e tests
        run: npm test
      - name: Structural validation (agy plugin validate --strict, when available)
        run: |
          if command -v agy >/dev/null 2>&1; then
            agy plugin validate --strict --json plugins/{{name}}
          else
            echo "agy not on PATH — skipping 'agy plugin validate'. Install the Antigravity CLI or run antigravity-meta-plugin-kit's lint.mjs --strict in CI."
          fi
