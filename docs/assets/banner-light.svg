<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="antigravity-meta-plugin-kit — Plugin Engineering Toolkit for Google Antigravity">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="glowLeftLight" cx="14%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRightLight" cx="92%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="orbitLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="gridLight" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748B" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="249" rx="18" fill="url(#bgLight)" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="1" y="1" width="998" height="248" rx="18" fill="url(#gridLight)"/>
  <rect x="1" y="1" width="998" height="248" rx="18" fill="url(#glowLeftLight)"/>
  <rect x="1" y="1" width="998" height="248" rx="18" fill="url(#glowRightLight)"/>

  <ellipse cx="940" cy="125" rx="140" ry="58" transform="rotate(-18 940 125)" fill="none" stroke="url(#orbitLight)" stroke-width="1.5" opacity="0.4"/>

  <!-- Emblem mark -->
  <g transform="translate(52, 49)">
    <rect x="0" y="0" width="152" height="152" rx="34" fill="#0F172A" stroke="url(#accentLight)" stroke-width="3.5"/>
    <ellipse cx="76" cy="80" rx="64" ry="24" transform="rotate(-20 76 80)" fill="none" stroke="url(#orbitLight)" stroke-width="4"/>
    <path d="M38 110 V46 L76 80 L114 46 V110" fill="none" stroke="#F8FAFC" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="76" cy="110" r="7" fill="#38BDF8"/>
    <circle cx="129" cy="57" r="4.8" fill="#60A5FA"/>
  </g>

  <!-- Typography -->
  <g transform="translate(242, 0)">
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#2563EB">GOOGLE ANTIGRAVITY · PLUGIN ENGINEERING TOOLKIT</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8" fill="#0F172A">antigravity-meta-plugin-kit</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#475569">Scaffold, lint, diagnose, probe, and ship native plugins without runtime traps.</text>

    <g transform="translate(0, 174)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#DBEAFE" stroke="#93C5FD"/>
      <circle cx="17" cy="15" r="3.8" fill="#2563EB"/>
      <text x="28" y="19" fill="#1E40AF">agy 1.5.17+</text>

      <rect x="130" y="0" width="136" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="198" y="19" text-anchor="middle" fill="#334155">CLI · App · IDE</text>

      <rect x="276" y="0" width="128" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="340" y="19" text-anchor="middle" fill="#334155">0 Dependencies</text>

      <rect x="414" y="0" width="102" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="465" y="19" text-anchor="middle" fill="#334155">Node &gt;= 20</text>

      <rect x="526" y="0" width="164" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="608" y="19" text-anchor="middle" fill="#3730A3">11 Skills · 3 Agents</text>
    </g>
  </g>
</svg>
